spring.application.name=campaignmanager

# Local overrides with real values (gitignored). Copy local.properties.example to start.
spring.config.import=optional:file:./local.properties

# Database: set DB_URL / DB_USERNAME / DB_PASSWORD in the environment or in local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campaign_dev?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT: the secret must be at least 32 characters, never commit the real one
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated list of frontend URLs allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Company totals are converted into this currency using the monthly exchange rates
app.base-currency=${BASE_CURRENCY:USD}

# First admin, created only when the users table is empty
app.bootstrap.admin-name=${ADMIN_NAME:Admin}
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@thedigitalsole.com}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
