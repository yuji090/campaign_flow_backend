# Production profile (Railway). Activate with SPRING_PROFILES_ACTIVE=prod.
# Values come from Railway environment variables. There are no defaults, so a missing variable stops startup.
spring.application.name=campaignmanager

# ===============================
# DATABASE (Railway Environment)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JPA / Hibernate
# ===============================
# Flyway creates and upgrades the schema on startup. Hibernate only checks that it matches the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ===============================
# JWT (Environment-driven)
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# Server PORT
# ===============================
server.port=${PORT:8080}

# ===============================
# App
# ===============================
# Your deployed frontend URL(s), comma-separated
app.cors.allowed-origins=https://frontend-topaz-one-48.vercel.app
app.base-currency=${BASE_CURRENCY:USD}

# First admin, created only when the users table is empty
app.bootstrap.admin-name=${ADMIN_NAME:Admin}
app.bootstrap.admin-email=${ADMIN_EMAIL}
app.bootstrap.admin-password=${ADMIN_PASSWORD}

# ===============================
# DB connection pool (saves memory)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
# Railway closes idle MySQL connections within a couple of minutes, so ping them every 30s and replace them every 60s
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=60000

# ===============================
# Logs (saves RAM)
# ===============================
logging.level.root=WARN
logging.level.org.hibernate=ERROR
logging.level.org.springframework=ERROR
logging.level.com.thedigitalsole=INFO
